name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml

  pull_request:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_password
          POSTGRES_DB: crm_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U crm -d crm_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      # 1) Забираем код репозитория
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2) Ставим Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 3) Ставим зависимости проекта
      # Заменила эту строчку pip install "passlib[bcrypt]" "python-jose[cryptography]"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt || true
          pip install fastapi uvicorn sqlalchemy psycopg2-binary alembic pydantic-settings
          pip install "pydantic[email]"
          pip install "bcrypt<4.0" "passlib[bcrypt]==1.7.4" "python-jose[cryptography]"
          pip install pytest httpx
         
      # 4) Прогоняем миграции в CI-базу
      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://crm:crm_password@127.0.0.1:5432/crm_db
        run: |
          alembic upgrade head

      # 5) Запускаем тесты
      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://crm:crm_password@127.0.0.1:5432/crm_db
        run: |
          python -m pytest -q